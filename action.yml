name: 'Minitest Report'
description: 'A GitHub Action that reports Minitest failures.'
branding:
  icon: alert-triangle
  color: red
author: 'davegudge'
inputs:
  token:
    description: 'Github token'
    required: false
    default: '${{ github.token }}'
  json-path:
    description: 'Path or glob pattern for Minitest JSON result files'
    required: true
  title:
    description: 'Title'
    default: '# :x: Minitest failure'
    required: false
  hideFooterLink:
    description: 'Hide footer link'
    default: 'false'
    required: false
  comment:
    description: 'Set this if want to comment report to pull request'
    default: 'true'
    required: false
runs:
  using: 'node24'
  main: 'dist/index.js'
